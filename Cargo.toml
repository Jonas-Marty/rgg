[package]
name = "rgg"
version = "0.1.0"
edition = "2024"

[dependencies]
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.34"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
toml = "1.2.1"
unicode-width = "0.2.3"

[profile.release]
lto = true
codegen-units = 1
strip = true

